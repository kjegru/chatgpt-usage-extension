<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Usage Limits</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="header-brand">
        <!-- Original bar-chart icon — no third-party trademarks -->
        <svg class="header-icon" id="header-brand-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <rect x="2"  y="12" width="4" height="10" rx="1"/>
          <rect x="10" y="7"  width="4" height="15" rx="1"/>
          <rect x="18" y="2"  width="4" height="20" rx="1"/>
        </svg>
        <span class="header-title">Usage Limits</span>
      </div>
      <button class="icon-btn" id="refresh-btn" title="Refresh usage">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>

    <div class="limit-list">
      <div class="limit-row" id="limit-5h">
        <div class="limit-info">
          <span class="limit-title">5-hour limit</span>
          <span class="limit-percent" id="percent-5h">--% left</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill status-green" id="progress-5h" style="width: 0%;"></div>
        </div>
        <div class="limit-meta">
          <span class="limit-reset" id="reset-5h">Loading...</span>
        </div>
      </div>

      <div class="limit-row" id="limit-weekly">
        <div class="limit-info">
          <span class="limit-title">Weekly limit</span>
          <span class="limit-percent" id="percent-weekly">--% left</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill status-green" id="progress-weekly" style="width: 0%;"></div>
        </div>
        <div class="limit-meta">
          <span class="limit-reset" id="reset-weekly">Loading...</span>
        </div>
      </div>

      <div class="settings-row">
        <label class="toggle-label" for="toggle-floating">
          <span>Floating widget on page</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="toggle-floating" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-row">
        <label class="toggle-label" for="toggle-badge">
          <span>Show percentage on icon</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="toggle-badge" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
