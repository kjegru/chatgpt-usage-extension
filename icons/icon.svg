<!-- Original icon — usage quota gauge. No third-party trademarks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#1e2a3a"/>

  <!-- Outer track ring (270° arc — gap at bottom) -->
  <circle cx="64" cy="64" r="46"
    fill="none"
    stroke="#2e3f52"
    stroke-width="10"
    stroke-dasharray="289 72"
    stroke-dashoffset="-36"
    stroke-linecap="round"
    transform="rotate(-135 64 64)"/>

  <!-- Gradient arc (same geometry, ~75% fill) -->
  <circle cx="64" cy="64" r="46"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-dasharray="217 144"
    stroke-dashoffset="-36"
    stroke-linecap="round"
    transform="rotate(-135 64 64)"/>

  <!-- Bar chart icon, centred -->
  <g transform="translate(45, 46)">
    <rect x="0"  y="20" width="8" height="14" rx="2" fill="white"/>
    <rect x="13" y="10" width="8" height="24" rx="2" fill="white"/>
    <rect x="26" y="2"  width="8" height="32" rx="2" fill="white"/>
  </g>
</svg>
