<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bakgrunnsgradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="45%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e0847"/>
    </linearGradient>

    <!-- Rammekant -->
    <linearGradient id="border" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Indre urskive -->
    <radialGradient id="dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#240c4f"/>
      <stop offset="85%" stop-color="#120429"/>
      <stop offset="100%" stop-color="#0a0217"/>
    </radialGradient>

    <!-- Taleboble -->
    <linearGradient id="bubble" x1="0%" y1="0%" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Progressbue del 1 og 2 -->
    <linearGradient id="arc1" x1="0%" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="arc2" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Bakgrunns-squircle -->
  <rect x="16" y="16" width="480" height="480" rx="115" ry="115" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>

  <!-- Urskiveplate og ytre ringer -->
  <circle cx="256" cy="256" r="185" fill="url(#dial)" stroke="#4c1d95" stroke-width="4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Markører rundt skiven -->
  <g stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="96" x2="256" y2="110" />
    <line x1="369" y1="143" x2="359" y2="153" />
    <line x1="416" y1="256" x2="402" y2="256" />
    <line x1="369" y1="369" x2="359" y2="359" />
    <line x1="256" y1="416" x2="256" y2="402" />
    <line x1="143" y1="369" x2="153" y2="359" />
    <line x1="96" y1="256" x2="110" y2="256" />
    <line x1="143" y1="143" x2="153" y2="153" />
  </g>

  <!-- Inaktivt spor bak måleren -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#2e1065" stroke-width="26"/>

  <!-- Aktiv progressbue (neon-glød bygget med opasitetslag) -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#06b6d4" stroke-width="42" stroke-linecap="round"
          stroke-dasharray="750 1000" stroke-dashoffset="140" transform="rotate(-90 256 256)" opacity="0.3"/>

  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#arc1)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="750 1000" stroke-dashoffset="140" transform="rotate(-90 256 256)"/>

  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#arc2)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="380 1000" stroke-dashoffset="140" transform="rotate(-90 256 256)"/>

  <circle cx="256" cy="256" r="158" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="720 1000" stroke-dashoffset="155" transform="rotate(-90 256 256)" opacity="0.8"/>

  <!-- Indre ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#6b21a8" stroke-width="3" opacity="0.6"/>

  <!-- Glød bak taleboble -->
  <circle cx="256" cy="256" r="80" fill="#06b6d4" opacity="0.25"/>

  <!-- Taleboble -->
  <path d="M 256 182 C 215 182 182 214 182 254 C 182 272 188 288 200 301 C 198 312 192 324 187 331 C 199 331 216 324 227 316 C 236 319 246 322 256 322 C 297 322 330 290 330 254 C 330 214 297 182 256 182 Z"
        fill="url(#bubble)"/>

  <!-- Lysrefleks på taleboblen -->
  <ellipse cx="248" cy="226" rx="36" ry="18" fill="#ffffff" opacity="0.5"/>

  <!-- Stjerner / Sparkles -->
  <g transform="translate(390, 115)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="3" fill="#67e8f9"/>
  </g>
  <g transform="translate(110, 390) scale(0.7)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(420, 370) scale(0.6)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#ffffff"/>
  </g>

  <!-- Diskret hjørnerefleksjon -->
  <path d="M 40 100 Q 180 40 380 40 C 430 40 460 70 460 110 Q 270 120 90 270 C 50 240 40 180 40 100 Z" fill="#ffffff" opacity="0.12"/>
</svg>
